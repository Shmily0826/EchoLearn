name = "yt-transcript-proxy"
main = "src/index.js"
compatibility_date = "2024-12-01"

workers_dev = true

[vars]
# Firebase Web API key — a public identifier that already ships in the client
# bundle (src/lib/firebase.ts); used by the Worker to verify ID tokens via
# the Identity Toolkit REST endpoint.
FIREBASE_WEB_API_KEY = "AIzaSyBv32XgQuKRkrjyLEYC9YIbYwqIT2PXttc"

# Global daily quota counters for paid routes (ASR/audio), shared across all
# isolates. Created 2026-10-01 via `wrangler kv namespace create QUOTAS`.
[[kv_namespaces]]
binding = "QUOTAS"
id = "67fd205adf2c4d788949c2244725d2d1"
