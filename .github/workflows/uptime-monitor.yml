# Scheduled synthetic monitoring for the caption pipeline.
#
# This workflow intentionally depends on live services — that is its purpose.
# (The vitest unit suite, by contrast, always mocks the network and must
# never depend on these endpoints.)
#
# GitHub emails the repo owner when a scheduled workflow run fails, which is
# the alerting path for outages like "CF Worker down" or "YTDLP_API_KEY not
# configured on Vercel". Runs twice a day; can also be triggered manually
# from the Actions tab ("Run workflow").

name: Uptime Monitor

on:
  schedule:
    # Twice daily at 09:21 and 21:21 UTC (off the busy :00 mark).
    - cron: '21 9,21 * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The dQ caption control is the only check flagged `paidProvider`, and it
    # runs with `retries: 0`, so one invocation per run is exactly what it
    # needs — two runs a day means at most two paid calls a day. dQ has
    # native captions, so the probe never reaches ASR.
    #
    # Without these the guard resolves to { enabled: false }, the control
    # reports BLOCKED, and health-check.mjs exits 2 — which makes every
    # scheduled run report red even when nothing is actually broken.
    # Plain values, not secrets: they encode policy, not credentials.
    env:
      ECHOLEARN_ALLOW_PAID_PROVIDER: '1'
      ECHOLEARN_PAID_MAX_INVOCATIONS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run caption-pipeline health check
        run: node scripts/health-check.mjs
