# Quality gate on every push to main and every PR:
# unit tests → type check + build → lint → E2E golden path.
#
# E2E runs against local servers and deterministic fixtures; it needs no
# external services or credentials. The integrated journey uses Vite preview
# so its service-worker/offline checks exercise the production build.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Glob, not a file list: naming files one by one is how the earlier
      # .mjs suites went unrun for weeks. New Worker tests are picked up
      # automatically.
      - run: node --test cf-worker/test/*.test.mjs
      # The reliability-baseline suite is node:test + .mjs, so vitest's include
      # (ts/tsx only) never picks it up and nothing else ran it. Unquoted glob
      # so the shell expands it; pass the files explicitly on shells that do
      # not glob (cmd.exe).
      - run: node --test scripts/reliability-baseline/*.test.mjs
      # Import-time deps of the VPS test suite: test_main.py imports the real
      # yt_dlp.parse_options to assert CLI option semantics, so the package
      # (not a mock) is required.
      - run: python -m pip install 'fastapi>=0.110' 'python-multipart>=0.0.9' 'yt-dlp'
      - run: python -m unittest discover -s vps-ytdlp -p 'test*.py'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 pulls undici 8, whose webidl helpers need Node >= 22 —
          # match the dev environment (Node 24) for the test/e2e jobs.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm run test:emulator

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # The suite grew past the point where one serial runner (workers: 1)
      # fit the 15-minute timeout with headroom; two shards halve the wall
      # clock while keeping each shard's serial, deterministic ordering.
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start production preview for E2E
        run: npm run preview -- --host 127.0.0.1 --port 5278 > /tmp/echolearn-preview.log 2>&1 &
      - name: Health-check production preview
        run: |
          node --input-type=module -e '
            const url = "http://127.0.0.1:5278/";
            for (let attempt = 0; attempt < 30; attempt += 1) {
              try {
                const response = await fetch(url);
                if (response.ok) process.exit(0);
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 1000));
            }
            console.error(`Production preview did not become healthy: ${url}`);
            process.exit(1);
          '
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --shard=${{ matrix.shard }}/2
